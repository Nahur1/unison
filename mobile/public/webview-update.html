<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unison Player</title>
    <!-- Shown by Capacitor when the phone's Android System WebView is older than
         android.minWebViewVersion (capacitor.config.ts). No scripts: it must
         work on any WebView. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        box-sizing: border-box;
        background: #15131a;
        color: #f6f4f9;
        font-family: sans-serif;
        text-align: center;
        line-height: 1.8;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 14px;
      }
      p {
        margin: 0 0 14px;
      }
      .en {
        color: #a9a5b5;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Unison Player</h1>
      <p>
        برای اجرای Unison، برنامهٔ «Android System WebView» یا «Google Chrome» را
        از Google Play به‌روز کنید و دوباره Unison را باز کنید.
      </p>
      <p class="en">
        This phone’s web engine is too old for Unison. Update “Android System
        WebView” (or Chrome) from Google Play, then open Unison again.
      </p>
    </div>
  </body>
</html>
